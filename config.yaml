project:
  name: "damage-segmentation-inference"
  task: "Ground-level infrastructure damage segmentation"

input:
  supported_formats:
    - ".jpg"
    - ".jpeg"
    - ".png"

patching:
  patch_size: 512
  stride: 256
  overlap: 256
  save_patches: true

yolo:
  model_path: "models/yolo/best.pt"
  confidence_threshold: 0.2
  iou_threshold: 0.2
  image_size: 512

sam:
  base_model_name: "facebook/sam-vit-large"
  checkpoint_path: "models/sam/sam_finetuned.pth"
  device: "auto"
  min_iou: 0.5
  bin_thresh: 0.5

classes:
  0: "Damaged Wall"
  1: "Damaged Window"
  2: "Debris"

mask_encoding:
  background: 0
  class_to_pixel_value:
    0: 1
    1: 2
    2: 3

outputs:
  save_full_mask: true
  save_overlay: true
  save_json: true
  save_patch_outputs: false

output_folders:
  masks: "outputs/masks"
  overlays: "outputs/overlays"
  json: "outputs/json"
  logs: "outputs/logs"
  temp: "outputs/temp"